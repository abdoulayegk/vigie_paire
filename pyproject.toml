[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie-paire"
version = "0.1.0"
description = "Outil d'extraction et de comparaison de rapports bancaires PDF"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.10",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "pymupdf>=1.27.1",
    "pymupdf-layout>=1.28.2",
    "pillow>=10.0.0",
    "docling>=2.73.1",
    "python-dotenv>=1.2.1",
    "openai>=2.21.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "pymupdf4llm>=1.28.2",
]

[project.scripts]
vigie-run-ranges = "vigie.cli.run_ranges:main"
vigie-run-tables = "vigie.cli.run_tables:main"
vigie-run-extract-report = "vigie.cli.run_extract_report:main"
vigie-run-compare-gpt4o = "vigie.cli.run_compare_gpt4o:main"
vigie-run-changements-communs = "vigie.cli.run_changements_communs:main"
vigie-run = "vigie.pipelines.complet:main"

[tool.setuptools]
package-dir = {"" = "src"}

# Decouverte automatique du package vigie (entree + coeur).
[tool.setuptools.packages.find]
where = ["src"]
include = ["vigie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
    "sphinxcontrib-mermaid>=0.9",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# D : docstrings. F : erreurs Pyflakes. I : tri des imports.
# E402 et PLC0415 imposent les imports en tete de module, hors exceptions
# documentees liees aux cycles, a Dash et aux chargements reellement differes.
select = ["D", "E402", "F", "I", "PLC0415"]
ignore = [
    "D105",
    "D107",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E402", "PLC0415"]
