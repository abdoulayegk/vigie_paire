[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie-paire"
version = "0.1.0"
description = "Outil d'extraction et de comparaison de rapports bancaires PDF"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.10",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
    "pymupdf>=1.27.1",
    "docling>=2.73.1",
    "python-dotenv>=1.2.1",
    "openai>=2.21.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0",
]

[project.scripts]
vigie-run-ranges = "vigilance.cli.run_ranges:main"
vigie-run-tables = "vigilance.cli.run_tables:main"
vigie-run-extract-report = "vigilance.cli.run_extract_report:main"
vigie-run-compare-gpt4o = "vigilance.cli.run_compare_gpt4o:main"
vigie-run = "run_full_pipeline:main"
vigie-validateur = "vigie.validateur:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "vigie",
    "vigilance",
    "vigilance.cli",
    "vigilance.config",
    "vigilance.dash_app",
    "vigilance.dash_app.callbacks",
    "vigilance.dash_app.components",
    "vigilance.dash_app.layouts",
    "vigilance.extraction",
    "vigilance.extract",
    "vigilance.i18n",
    "vigilance.models",
    "vigilance.quality",
    "vigilance.report",
    "vigilance.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
    "sphinxcontrib-mermaid>=0.9",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["D"]
ignore = [
    "D105",
    "D107",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
