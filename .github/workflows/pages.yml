name: Publier la documentation GitHub Pages

# Construit et deploie le site Sphinx avec le mecanisme officiel GitHub Pages.
# Activation initiale unique : Settings -> Pages -> Source : GitHub Actions.
# Ensuite, chaque push/merge sur `main` redeploie automatiquement le site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.11

      - name: Installer les dépendances de documentation
        run: uv sync --group dev --group docs

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Construire le site Sphinx
        env:
          SPHINX_HTML_BASEURL: ${{ steps.pages.outputs.base_url }}/
        run: |
          uv run sphinx-build -b html docs docs/_build/html
          test -f docs/_build/html/index.html

      - name: Charger l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
