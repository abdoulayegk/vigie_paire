name: Publier la documentation GitHub Pages

# Pousse le HTML Sphinx sur la branche `gh-pages`.
# Sur GitHub : Settings -> Pages -> Source : Deploy from a branch
# -> Branch : gh-pages -> Folder : / (root)
# (Pas "GitHub Actions" pour ce mode ; la branche contient index.html.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.11

      - name: Installer les dépendances de documentation
        run: uv sync --group dev --group docs

      - name: Construire le site Sphinx
        env:
          SPHINX_HTML_BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          uv run sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll
          test -f docs/_build/html/index.html

      - name: Publier sur la branche gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/_build/html
          clean: true
