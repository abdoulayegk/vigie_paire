# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

target_sections:
  - "capital_management"
  - "risk_management"
  - "regulatory_updates"

banks_with_regulatory:
  - "rbc"
  - "bns"
  - "bmo"

page_ranges_documentation:
  _comment: "CONVENTION IMPORTANTE POUR page_ranges"
  numerotation: "Les valeurs dans page_ranges utilisent la NUMEROTATION DOCUMENT (pied de page du rapport), PAS la numerotation physique du PDF."
  offset: "Pour les banques avec page_number_offset (ex: CIBC offset=3), le systeme ajoute automatiquement l'offset pour obtenir la page physique."
  exemple_cibc: "TOC dit 'Gestion des fonds propres: page 20' -> page_ranges.start=20 -> page physique extraite = 20+3 = 23"
  quand_utiliser: "Utiliser page_ranges quand la detection automatique (TOC/scan) ne fonctionne pas bien pour une banque specifique."

section_boundary_detection:
  methods:
    - "toc"
    - "scan"
    - "following_section"
    - "manual_override"
  priority_order:
    - "manual_override"
    - "toc"
    - "following_section"
    - "scan"
  default_section_length: 20
  min_section_length: 3
  max_section_length: 50
  section_length_overrides:
    gestion_reglementation:
      min_pages: 1
      max_pages: 3
      default_span: 3

following_section_patterns:
  capital_management:
    - "gestion des risques"
    - "gestion du risque"
    - "risque de credit"
    - "facteurs de risque"
  risk_management:
    - "etats financiers"
    - "informations complementaires"
    - "renseignements complementaires"
    - "donnees complementaires"
    - "annexes"
    - "notes aux etats"
    - "glossaire"

comparison_rules:
  valid_comparisons:
    - from: "t1"
      to: "t2"
    - from: "t2"
      to: "t3"
  excluded_comparisons:
    - from: "t1"
      to: "t3"
    - from: "t3"
      to: "t1"

change_classification:
  types:
    - "NOUVEL_INDICATEUR"
    - "NOUVELLE_IDEE"
    - "MODIFIE"
    - "SUPPRIME"
  categories:
    - "REGLEMENTAIRE"
    - "RISQUE_EMERGENT"
    - "ESG"
    - "INDICATEUR"
    - "AUTRE"
  significance:
    - "MAJEUR"
    - "MODERE"
    - "MINEUR"
  desjardins_relevance:
    - "HAUTE"
    - "MOYENNE"
    - "BASSE"

trend_detection:
  min_banks_for_trend: 3
  similarity_thresholds:
    REGULATORY: 0.8
    RISK_EMERGING: 0.75
    ESG: 0.75
    INDICATOR: 0.85
    OTHER: 0.7

matching_thresholds:
  use_hungarian_matching: true
  matching_v2_enabled: true
  use_post_hungarian_threshold: true
  use_embeddings: false
  embedding_weight_table: 0.12
  embedding_weight_indicator: 0.35
  embedding_model: "text-embedding-3-small"
  hungarian_min_score: 0.62
  ignore_table_id_for_number: true
  section_unknown_mode: soft_penalty
  unknown_section_penalty: 0.15
  title_exact: 1.0
  title_semantic: 0.9
  indicator_semantic: 0.9
  indicator_structural: 0.8
  minimum_match: 0.7
  section_detection: 0.85
  table_extraction: 0.9
  change_detection: 0.95
  false_positive_rejection: 0.7
  table_match_score: 0.58
  match_score_v2: 0.70
  probable_score_v2: 0.62
  indicator_low_score_uncertain: 0.60
  indicator_match_reject_title_similarity: 0.70
  indicator_match_reject_jaccard: 0.35
  indicator_rename_threshold: 0.80
  indicator_fuzzy_token_threshold: 0.80
  neighbor_aligned_filter_enabled: true
  indicator_rename_probable_threshold: 0.90
  indicator_rename_short_label_threshold: 0.95
  indicator_rename_position_weight: 0.10
  indicator_rename_neighborhood_weight: 0.05
  indicator_rescue_split_merge_min: 0.60
  indicator_rescue_jaccard_min: 0.55
  indicator_exist_near_exact_threshold: 0.95
  indicator_exist_llm_band_min: 0.85
  indicator_exist_llm_band_max: 0.95
  indicator_near_stable_threshold: 0.95
  indicator_near_stable_large_table_threshold: 0.92
  indicator_near_stable_large_table_min_indicators: 40
  indicator_near_stable_use_token_set: false
  indicator_order_aware_alignment_enabled: false
  indicator_order_aware_min_ratio: 0.85
  indicator_order_aware_band_window: 50
  indicator_hungarian_large_matrix_cap: 500
  indicator_hungarian_large_matrix_min_score: 0.88
  indicator_length_ratio_min: 0.75
  indicator_group_strict: false
  indicator_displacement_fuzzy_threshold: 0.90
