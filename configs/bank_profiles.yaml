version: "1.0"

vision_extraction:
  enabled: true
  bottom_extension_footnotes: 0.12
  run_on_all_tables: true
  fallback_to_docling_on_error: true
  schema_failure_policy: fail_fast
  save_indicators_footnotes_json: true
  vision_pair_validation: false
  # Bbox sanity gate: reject crops before Vision (too small, near-full-page, etc.)
  bbox_min_width: 0.02
  bbox_min_height: 0.02
  bbox_min_area: 0.0005
  bbox_max_area: 0.95
  bbox_near_full_page_threshold: 0.90
  horizontal_padding: 0.02
  top_extension_title: 0.03
  adaptive_bottom_extension_enabled: false
  adaptive_bottom_extension_increment: 0.06
  vision_cache_enabled: true
  vision_extraction_max_workers: 4
  # Optional: cap Vision API calls per run; when hit, affected tables are review_required/blocked (quality-first).
  # max_vision_calls_per_run: 200
  api_retry_max: 3
  api_retry_backoff_ms: 1000
  api_timeout_sec: 120
  # Single pipeline: one max_completion_tokens for all Vision table extraction (no full/lean).
  # 128k is model context (input+output); current Vision models allow at most 16k completion tokens.
  vision_max_completion_tokens: 16384
  vision_reference_text_max_chars: 6000
  # DPI for table crop rendering (higher = sharper but larger images). Default: 300.
  vision_crop_dpi: 300
  # Enable/disable image preprocessing (contrast, sharpening). Default: true.
  vision_preprocess: true
  page_level_title_assist:
    enabled: false
    min_confidence: 0.7
    max_candidates: 10
    weak_title_threshold: 3
    allow_positional_fallback: false
    max_pages_per_run: 50
    cache_enabled: true

quality_gate:
  enabled: true
  duplicate_ratio_threshold: 0.15
  max_tables_duplicate_excess: 3
  max_contaminated_titles: 2
  line_split_max_per_table: 2
  missing_marker_majority_threshold: 0.5
  title_numeric_density_threshold: 0.45
  # Extraction certification (quality-first): fail run when blocked/review_required exceed limits.
  max_tables_blocked: 0
  max_tables_review_required: 10
  fail_on_budget_exhausted: true

# Validation post-matching: filtres GenAI/Vision pour reduire faux positifs.
# Voir docs/comparison-validation.md pour le schema et valeurs recommandees.
validation:
  vision_pair_validation: false
  vision_pair_confidence_min: 0.75
  semantic_judge_enabled: false
  semantic_judge_banks: [rbc, bns, td]
  rename_validator_enabled: false
  rename_validator_confidence_min: 0.8
  rename_validator_batch_size: 10
  rename_validator_uncertain_score_band: [0.85, 0.95]
  added_table_validator_enabled: false
  added_table_validator_confidence_min: 0.75
  indicator_validator_enabled: false
  indicator_validator_use_vision: true
  indicator_validator_confidence_min: 0.8
  indicator_validator_batch_size: 8
  vision_unmatched_rescue_enabled: true
  cross_section_rescue_enabled: true
  cross_section_rescue_rerank_min: 0.30
  cross_section_rescue_vision_confidence_min: 0.85
  cross_section_rescue_max_candidates_per_table: 3

